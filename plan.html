<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Plan · Trips</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e0c0b">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Trips">
<script src="config.js"></script>
<script src="store.js"></script>
<style>
  :root{--bg:#f2f2f7;--card:#fff;--ink:#1d1d1f;--mute:#8a8a8e;--line:rgba(60,60,67,.14);--blue:#0a84ff;--green:#34c759;--orange:#ff9f0a;--tbd:#fff4e5}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;font-size:17px;padding-bottom:60px}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}
  .head{position:sticky;top:0;z-index:5;background:rgba(242,242,247,.86);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);padding:10px 16px 12px;margin:0 -16px}
  .nav{display:flex;align-items:center;gap:14px;height:36px}
  .nav a{color:var(--blue);text-decoration:none;font-size:17px}
  .nav .back{margin-right:auto;display:flex;align-items:center}
  .nav .back::before{content:"";width:10px;height:10px;border-left:2.5px solid var(--blue);border-bottom:2.5px solid var(--blue);transform:rotate(45deg);margin:0 6px 0 4px}
  h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:8px 0 2px}
  .sub{font-size:14px;color:var(--mute)}
  .pct{font-size:14px;color:var(--mute);margin-top:10px}
  .pct b{color:var(--ink)}
  .bar{height:6px;border-radius:6px;background:rgba(118,118,128,.18);margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .4s}
  .day{margin-top:22px}
  .dh{display:flex;align-items:baseline;gap:10px;margin:0 16px 7px}
  .dh b{font-size:15px}
  .dh span{font-size:13px;color:var(--mute)}
  .dh a{margin-left:auto;font-size:13px;color:var(--blue);text-decoration:none;white-space:nowrap}
  .list{background:var(--card);border-radius:14px;overflow:hidden}
  label.row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;cursor:pointer;position:relative}
  label.row+label.row::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:1px solid var(--line)}
  label.row input{width:22px;height:22px;accent-color:var(--green);flex:none;margin:1px 0 0}
  label.row .t{flex:1;line-height:1.3}
  label.row .t small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
  label.row input:checked~.t{color:var(--mute);text-decoration:line-through}
  label.row.tbd{background:var(--tbd)}
  label.row.tbd::after{content:"TBD";position:absolute;right:16px;top:14px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--orange)}
  label.row.tbd .t{padding-right:40px}
  .empty{padding:40px 16px;text-align:center;color:var(--mute);font-size:14px;border:1px dashed var(--line);border-radius:14px;margin-top:22px}
  .hint{font-size:13px;color:var(--mute);margin:10px 16px 0;line-height:1.45}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="nav"><a class="back" href="outfits.html" id="tripName">Trip</a><a href="budget.html">Budget</a><a href="packing.html">Packing</a></div>
    <h1>The plan</h1>
    <div class="sub" id="tripSub"></div>
    <div class="pct" id="pct"></div>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <div id="days"></div>
  <div class="hint">Tick a line when it is booked, decided, or done. Orange lines still need a decision. "Outfits" opens that day on the wheel.</div>
</div>

<script>
Store.ready().then(()=>{
const TRIPC=Store.get('cfg:trip',{});
document.getElementById('tripName').textContent=TRIPC.name||'Trip';
document.getElementById('tripSub').textContent=TRIPC.sub||'';
/* Day by day, from the seed. Each item: [text, note?, tbd?]. tbd = still needs a choice or a booking. */
const DAYS=Store.get('cfg:plan',[]);
const KEY=Store.key('plan'); let done={}; try{done=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done));}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  let n=0,total=0;
  document.getElementById('days').innerHTML=DAYS.length?DAYS.map((day,di)=>`<div class="day"><div class="dh"><b>${esc(day.d)}</b><span>${esc(day.t||'')}</span>${day.w!=null?`<a href="outfits.html?day=${day.w}">Outfits ›</a>`:''}</div><div class="list">
    ${day.items.map((it,i)=>{const id=`${di}-${i}`;total++;if(done[id])n++;return `<label class="row ${it[2]?'tbd':''}"><input type="checkbox" data-id="${id}" ${done[id]?'checked':''}><span class="t">${esc(it[0])}${it[1]?`<small>${esc(it[1])}</small>`:''}</span></label>`;}).join('')}
  </div></div>`).join(''):'<div class="empty">No plan yet for this trip.</div>';
  const tbd=DAYS.flatMap((d,di)=>d.items.map((it,i)=>it[2]&&!done[`${di}-${i}`]?1:0)).reduce((a,b)=>a+b,0);
  document.getElementById('pct').innerHTML=`<b>${n}</b> of ${total} done · <b>${tbd}</b> still to decide`;
  document.getElementById('bar').firstChild.style.width=(total?n/total*100:0)+'%';
}
document.getElementById('days').addEventListener('change',e=>{const id=e.target.dataset.id;if(!id)return;done[id]=e.target.checked;save();render();});
render();
});
</script>
</body>
</html>
